<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 300px;
      height: 100px;
      background-color: lightblue;
      padding: 20px;
      transform: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">Hey I am box</div>
    <button id="btn">Change content</button>
  </div>

  <script>
    let button = document.getElementById("btn");
    let box=document.getElementById("myBox");

    // Corrected spelling: addEventListener and "click"
    button.addEventListener("dblclick", () => {
      document.querySelector(".box").innerHTML = "<br>Yayy! You were clicked. <b>Enjoy a click!</b>";
    });

   box.addEventListener("mouseover",()=>{
    box.style.backgroundColor="orange";
    box.innerHTML="Mouse is over the box!";
   });

   box.addEventListener("mouseout",()=>{
    box.style.backgroundColor="lightblue";
    box.innerHTML="Mouse left the box!";
   })
  </script>
</body>
</html>
